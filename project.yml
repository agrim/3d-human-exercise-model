name: HumanExerciseModels
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ExerciseDummy:
    path: Revision
targets:
  HumanExerciseModels:
    type: application
    platform: iOS
    sources:
      - Revision/Preview
    dependencies:
      - package: ExerciseDummy
        product: ExerciseDummy
    settings:
      base:
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.agrimgupta.exercisedummy.revision
        INFOPLIST_KEY_CFBundleDisplayName: Exercise Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  HumanExerciseModels:
    build:
      targets:
        HumanExerciseModels: all
